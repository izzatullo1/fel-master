<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fe’l Master</title>
<style>body{font:16px system-ui,-apple-system,sans-serif;background:#eef3fb;color:#17243c;margin:0}main{max-width:560px;margin:20px auto;padding:18px;background:white;border-radius:22px;box-shadow:0 8px 28px #0001}h1{margin:0}small,.muted{color:#64748b}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.stat{background:#eef4ff;padding:12px 6px;border-radius:12px;text-align:center}.stat strong{display:block;font-size:24px}.stat small{font-size:12px}button{border:0;border-radius:12px;padding:12px 15px;background:#2563eb;color:white;font:600 16px system-ui;cursor:pointer;margin:4px}button:disabled{opacity:.45}.choice{display:block;width:100%;text-align:left;background:#e8effc;color:#17243c;margin:9px 0}.chosen{outline:3px solid #2563eb}.card{background:#f1f5fa;border-radius:12px;padding:12px;margin:10px 0}.big{font-size:23px;font-weight:700;margin:18px 0}.bar{background:#dce5f3;height:10px;border-radius:9px;margin:18px 0}.fill{height:100%;background:#2563eb;border-radius:9px;width:0}.tiles{display:flex;flex-wrap:wrap;gap:4px}.answer{padding:15px;min-height:24px;border:2px dashed #abc;border-radius:10px;margin:12px 0;letter-spacing:3px}input{font-size:20px;padding:12px;width:90%;border:2px solid #ccd6e6;border-radius:10px}.ok{color:green}.no{color:#bd2525}.secondary{background:#e4eaf4;color:#17243c}.actions{margin-top:18px}footer{font-size:12px;color:#64748b;margin-top:25px}</style></head><body><main><h1>📘 Fe’l Master</h1><small>5 bosqich • 10 tadan • 1–3–7–30 kun takrorlash</small><div class="stats"><div class="stat"><strong id="today">0</strong><small>Bugun yodlangan</small></div><div class="stat"><strong id="total">0</strong><small>Jami yodlangan</small></div><div class="stat"><strong id="due">0</strong><small>Takrorlash kerak</small></div></div><div class="bar"><div class="fill" id="progress"></div></div><section id="screen"></section><footer>Natijalar shu brauzerda saqlanadi. Brauzer ma’lumotlari o‘chirilsa, natijalar ham yo‘qolishi mumkin.</footer></main><script>
'use strict';
const raw=[
['go','went','gone','gou','uent','gon','Bormoq'],['come','came','come','kam','keym','kam','Kelmoq'],['eat','ate','eaten','iit','eyt','iitn','Yemoq'],['drink','drank','drunk','drink','drenk','drank','Ichmoq'],['see','saw','seen','sii','so','siin','Ko‘rmoq'],['sleep','slept','slept','sliip','slept','slept','Uxlamoq'],['write','wrote','written','rayt','rout','ritn','Yozmoq'],['speak','spoke','spoken','spiik','spouk','spoukn','Gapirmoq'],['buy','bought','bought','bay','bot','bot','Sotib olmoq'],['take','took','taken','teyk','tuk','teykn','Olmoq'],
['make','made','made','meyk','meyd','meyd','Yasamoq'],['have','had','had','hev','hed','hed','Ega bo‘lmoq'],['do','did','done','du','did','dan','Qilmoq'],['get','got','got','get','got','got','Qo‘lga kiritmoq'],['give','gave','given','giv','geyv','givn','Bermoq'],['find','found','found','faynd','faund','faund','Topmoq'],['think','thought','thought','sink','sot','sot','O‘ylamoq'],['know','knew','known','nou','nyu','noun','Bilmoq'],['run','ran','run','ran','ren','ran','Yugurmoq'],['read','read','read','riid','red','red','O‘qimoq'],
['begin','began','begun','bigin','bigen','big an','Boshlamoq'],['break','broke','broken','breyk','brouk','broukn','Sindirmoq'],['bring','brought','brought','bring','brot','brot','Olib kelmoq'],['build','built','built','bild','bilt','bilt','Qurmoq'],['catch','caught','caught','kech','kot','kot','Tutmoq'],['choose','chose','chosen','chuuz','chouz','chouzn','Tanlamoq'],['drive','drove','driven','drayv','drouv','drivn','Haydamoq'],['feel','felt','felt','fiil','felt','felt','His qilmoq'],['leave','left','left','liiv','left','left','Ketmoq'],['meet','met','met','miit','met','met','Uchrashmoq'],
['pay','paid','paid','pey','peyd','peyd','To‘lamoq'],['put','put','put','put','put','put','Qo‘ymoq'],['send','sent','sent','send','sent','sent','Yubormoq'],['sell','sold','sold','sel','sould','sould','Sotmoq'],['sit','sat','sat','sit','set','set','O‘tirmoq'],['stand','stood','stood','stend','stud','stud','Turmoq'],['teach','taught','taught','tiich','tot','tot','O‘qitmoq'],['tell','told','told','tel','tould','tould','Aytib bermoq'],['understand','understood','understood','anderstend','anderstud','anderstud','Tushunmoq'],['wear','wore','worn','uer','uor','uorn','Kiymoq']];
const verbs=raw.map(x=>({v:x.slice(0,3),p:x.slice(3,6),uz:x[6]})), intervals=[1,3,7,30],key='felmaster_progress_v2';
let data;try{data=JSON.parse(localStorage.getItem(key))||{learned:{}}}catch{data={learned:{}}}if(!data.learned)data.learned={};
const screen=document.querySelector('#screen'),progress=document.querySelector('#progress');
let mode='',batch=[],stage=1,index=0,score=0,done=false,selection='',picked=[],letters=[],questions=[],mistakes=new Set();
function dateKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function afterDays(days){let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+days);return dateKey(d)}
function save(){localStorage.setItem(key,JSON.stringify(data));stats()}
function dueIds(){return Object.keys(data.learned).map(Number).filter(i=>data.learned[i].next<=dateKey())}
function stats(){let a=Object.values(data.learned);document.querySelector('#today').textContent=a.filter(x=>x.learnedAt===dateKey()).length;document.querySelector('#total').textContent=a.length;document.querySelector('#due').textContent=dueIds().length}
function mix(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function el(tag,txt='',cls='',parent=screen){let e=document.createElement(tag);e.textContent=txt;e.className=cls;parent.append(e);return e}
function btn(txt,fn,cls='',parent=screen){let e=el('button',txt,cls,parent);e.onclick=fn;return e}
function say(w){if(!('speechSynthesis' in window)){alert('Bu brauzerda ovoz yo‘q');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}
function home(){mode='';screen.replaceChildren();progress.style.width='0';stats();el('h2','Mashg‘ulotni tanlang');let fresh=verbs.map((_,i)=>i).filter(i=>!data.learned[i]);el('p','Yangi fe’llar qolgan: '+fresh.length,'muted');btn('📚 10 ta yangi fe’l',()=>start('new',fresh.slice(0,10)), '',screen).disabled=!fresh.length;let due=dueIds();btn('🔁 Takrorlash ('+due.length+')',()=>start('review',due.slice(0,10)),'secondary').disabled=!due.length;el('p','Takrorlash muddati kelgan fe’llar ertangi mashg‘ulotga ham qoladi, to‘g‘ri javob berilmaguncha yo‘qolmaydi.','muted')}
function start(m,ids){if(!ids.length)return home();mode=m;batch=ids;stage=m==='new'?1:2;index=0;score=0;mistakes=new Set();render()}
function next(){index++;if(index===batch.length){stage++;index=0;if(stage===4||stage===5)questions=mix(batch.flatMap(i=>[0,1,2].map(f=>({i,f})))).slice(0,batch.length)}if(stage===6){finish();return}render()}
function check(ok,correct,wordId){if(done)return;done=true;if(ok)score++;else mistakes.add(wordId);el('p',ok?'✅ To‘g‘ri!':'❌ To‘g‘ri javob: '+correct,ok?'ok':'no');btn('Keyingisi →',next)}
function render(){done=false;selection='';picked=[];screen.replaceChildren();let first=mode==='new'?1:2;progress.style.width=(((stage-first)*batch.length+index)/((6-first)*batch.length)*100)+'%';el('h2',['','1. Yodlash','2. Tarjimasini topish','3. Fe’lni topish','4. Harflarni tartiblash','5. Mustaqil yozish'][stage]);el('small',(index+1)+'/'+batch.length+' · '+(mode==='new'?'Yangi fe’llar':'Takrorlash'));let id=batch[index],v=verbs[id];
if(stage===1){el('div',v.uz,'big');v.v.forEach((w,i)=>{let c=el('div','V'+(i+1)+': '+w+' ('+v.p[i]+')','card');btn('🔊',()=>say(w),'',c)});btn('Keyingisi →',next);return}
if(stage===2||stage===3){let correct=stage===2?v.uz:v.v.join(' — ');el('div',stage===2?v.v.join(' — '):v.uz,'big');if(stage===2)v.v.forEach(w=>btn('🔊 '+w,()=>say(w)));let pool=verbs.map(x=>stage===2?x.uz:x.v.join(' — '));let options=mix([correct,...mix([...new Set(pool.filter(x=>x!==correct))]).slice(0,3)]);let area=el('div');options.forEach(o=>btn(o,()=>{if(done)return;selection=o;area.querySelectorAll('button').forEach(b=>b.classList.toggle('chosen',b.textContent===o))},'choice',area));btn('Tekshirish',()=>{if(!selection||done)return;area.querySelectorAll('button').forEach(b=>b.disabled=true);check(selection===correct,correct,id)});return}
let q=questions[index],target=verbs[q.i].v[q.f];el('div',verbs[q.i].uz+' — V'+(q.f+1),'big');
if(stage===4){letters=mix([...target]);let answer=el('div','','answer'),tiles=el('div','','tiles');function redraw(){answer.textContent=picked.map(i=>letters[i]).join('');tiles.replaceChildren();letters.forEach((c,i)=>{if(!picked.includes(i))btn(c,()=>{if(!done){picked.push(i);redraw()}},'',tiles)})}redraw();btn('↶ Orqaga',()=>{if(!done){picked.pop();redraw()}});btn('Tekshirish',()=>{if(!done&&picked.length===letters.length)check(picked.map(i=>letters[i]).join('')===target,target,q.i)});return}
let input=el('input');input.placeholder='Fe’lni inglizcha yoz';input.autocapitalize='off';input.autocomplete='off';input.spellcheck=false;btn('Tekshirish',()=>{if(done||!input.value.trim())return;input.disabled=true;check(input.value.trim().toLowerCase()===target,target,q.i)})}
function finish(){progress.style.width='100%';let completed=batch.length-mistakes.size;batch.forEach(i=>{let old=data.learned[i];if(mode==='new'){data.learned[i]={learnedAt:dateKey(),step:0,next:afterDays(mistakes.has(i)?1:1)}}else if(old){if(mistakes.has(i)){old.next=afterDays(1)}else{old.step=Math.min(old.step+1,intervals.length);old.next=old.step>=intervals.length?'9999-12-31':afterDays(intervals[old.step])}}});save();screen.replaceChildren();el('h2','🎉 Mashg‘ulot tugadi');el('p','To‘g‘ri javoblar: '+score);el('p','Xatosiz fe’llar: '+completed+'/'+batch.length);el('p','Xato qilingan fe’llar ertaga yana takrorlanadi. Ular jami yodlanganlar soniga qayta qo‘shilmaydi.','muted');btn('Bosh sahifa',home)}
home();
</script></body></html>
