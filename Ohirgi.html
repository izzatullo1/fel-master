<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fe’l Master</title><style>body{font:17px system-ui;background:#f1f5fb;color:#17243c;margin:0}main{max-width:520px;margin:25px auto;padding:20px;background:white;border-radius:22px;box-shadow:0 8px 30px #0001}h1{margin:0}small{color:#64748b}button{border:0;border-radius:12px;padding:13px 17px;background:#2563eb;color:white;font:600 16px system-ui;cursor:pointer;margin:4px}button:disabled{opacity:.5}.choice{display:block;width:100%;text-align:left;background:#e9effb;color:#17243c;margin:9px 0}.chosen{outline:3px solid #2563eb}.card{background:#f1f5fa;border-radius:12px;padding:14px;margin:10px 0}.big{font-size:24px;font-weight:700;margin:20px 0}.bar{background:#dce5f3;height:10px;border-radius:9px;margin:20px 0}.fill{height:100%;background:#2563eb;border-radius:9px;width:0}.tiles{display:flex;flex-wrap:wrap;gap:4px}.answer{padding:15px;min-height:25px;border:2px dashed #abc;border-radius:10px;margin:12px 0;letter-spacing:3px}input{font-size:20px;padding:12px;width:90%;border:2px solid #ccd6e6;border-radius:10px}.ok{color:green}.no{color:#bd2525}</style></head><body><main><h1>📘 Fe’l Master</h1><small>10 ta fe’l • 5 bosqich • ovozli talaffuz</small><div class="bar"><div class="fill" id="progress"></div></div><section id="screen"></section></main><script>
const verbs=[
{v:['go','went','gone'],p:['gou','uent','gon'],uz:'Bormoq'},
{v:['come','came','come'],p:['kam','keym','kam'],uz:'Kelmoq'},
{v:['eat','ate','eaten'],p:['iit','eyt','iitn'],uz:'Yemoq'},
{v:['drink','drank','drunk'],p:['drink','drenk','drank'],uz:'Ichmoq'},
{v:['see','saw','seen'],p:['sii','so','siin'],uz:'Ko‘rmoq'},
{v:['sleep','slept','slept'],p:['sliip','slept','slept'],uz:'Uxlamoq'},
{v:['write','wrote','written'],p:['rayt','rout','ritn'],uz:'Yozmoq'},
{v:['speak','spoke','spoken'],p:['spiik','spouk','spoukn'],uz:'Gapirmoq'},
{v:['buy','bought','bought'],p:['bay','bot','bot'],uz:'Sotib olmoq'},
{v:['take','took','taken'],p:['teyk','tuk','teykn'],uz:'Olmoq'}];
let stage=1,index=0,score=0,done=false,selection='',picked=[],letters=[],questions=[];
const screen=document.querySelector('#screen'),progress=document.querySelector('#progress');
function mix(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function el(tag,txt='',cls='',parent=screen){const e=document.createElement(tag);e.textContent=txt;e.className=cls;parent.append(e);return e}
function btn(txt,fn,cls='',parent=screen){const e=el('button',txt,cls,parent);e.onclick=fn;return e}
function say(w){if(!('speechSynthesis' in window)){alert('Ovoz qo‘llanmaydi');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}
function next(){index++;if(index===10){stage++;index=0;if(stage===4||stage===5)questions=mix(verbs.flatMap((v,i)=>[0,1,2].map(f=>({i,f})))).slice(0,10)}if(stage===6){finish();return}render()}
function check(ok,correct){if(done)return;done=true;if(ok)score++;el('p',ok?'✅ To‘g‘ri!':'❌ To‘g‘ri javob: '+correct,ok?'ok':'no');btn('Keyingisi →',next)}
function render(){done=false;selection='';picked=[];screen.replaceChildren();progress.style.width=(((stage-1)*10+index)/50*100)+'%';el('h2',['','1. Yodlash','2. Tarjimasini topish','3. Fe’lni topish','4. Harflarni tartiblash','5. Mustaqil yozish'][stage]);el('small',(index+1)+'/10');let v=verbs[index];
if(stage===1){el('div',v.uz,'big');v.v.forEach((w,i)=>{let c=el('div','V'+(i+1)+': '+w+' ('+v.p[i]+')','card');btn('🔊',()=>say(w),'',c)});btn('Keyingisi →',next);return}
if(stage===2||stage===3){let correct=stage===2?v.uz:v.v.join(' — ');el('div',stage===2?v.v.join(' — '):v.uz,'big');if(stage===2)v.v.forEach(w=>btn('🔊 '+w,()=>say(w)));let pool=verbs.map(x=>stage===2?x.uz:x.v.join(' — '));let options=mix([correct,...mix(pool.filter(x=>x!==correct)).slice(0,3)]);let area=el('div');options.forEach(o=>btn(o,()=>{if(done)return;selection=o;area.querySelectorAll('button').forEach(b=>b.classList.toggle('chosen',b.textContent===o))},'choice',area));btn('Tekshirish',()=>{if(!selection||done)return;area.querySelectorAll('button').forEach(b=>b.disabled=true);check(selection===correct,correct)});return}
let q=questions[index],target=verbs[q.i].v[q.f];el('div',verbs[q.i].uz+' — V'+(q.f+1),'big');
if(stage===4){letters=mix([...target]);let answer=el('div','','answer'),tiles=el('div','','tiles');function redraw(){answer.textContent=picked.map(i=>letters[i]).join('');tiles.replaceChildren();letters.forEach((c,i)=>{if(!picked.includes(i))btn(c,()=>{if(!done){picked.push(i);redraw()}},'',tiles)})}redraw();btn('↶ Orqaga',()=>{if(!done){picked.pop();redraw()}});btn('Tekshirish',()=>{if(!done&&picked.length===letters.length)check(picked.map(i=>letters[i]).join('')===target,target)});return}
let input=el('input');input.placeholder='Fe’lni inglizcha yoz';input.autocapitalize='off';input.autocomplete='off';input.spellcheck=false;btn('Tekshirish',()=>{if(done||!input.value.trim())return;input.disabled=true;check(input.value.trim().toLowerCase()===target,target)})}
function finish(){progress.style.width='100%';screen.replaceChildren();el('h2','🎉 Barcha bosqichlar tugadi!');el('p','Natija: '+score+'/40');btn('Qayta boshlash',()=>{stage=1;index=0;score=0;render()})}render();
</script></body></html>
